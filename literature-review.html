    <section class="page-heading">
      <div class="section-number">02</div>
      <h1>Literature Review</h1>
      <p>A collection of documented achievements, memories, and notable findings.</p>
    </section>

    <section class="achievement-grid" aria-label="Achievements and memories">

      <!-- ================================================================
           EACH CARD BELOW IS EDITABLE.
           Change the title and hidden text. Do NOT change data-reveal-card.
           Clicking a card reveals its content ON THIS SAME PAGE.
           ================================================================ -->

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">01</span>
          <span class="card-rule"></span>
          <span class="achievement-title">A Little Discovery</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            This is where your first achievement, memory, inside joke, or
            beautiful observation goes.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">02</span>
          <span class="card-rule"></span>
          <span class="achievement-title">The First Milestone</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Write the second memory or achievement here. Make it as personal,
            funny, dramatic, or sentimental as you like.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">03</span>
          <span class="card-rule"></span>
          <span class="achievement-title">An Unexpected Result</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Your third finding goes here. This can be a moment that still
            makes you laugh whenever you remember it.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">04</span>
          <span class="card-rule"></span>
          <span class="achievement-title">A Significant Achievement</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Describe something they achieved, survived, learned, created,
            or accomplished.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">05</span>
          <span class="card-rule"></span>
          <span class="achievement-title">The Memorable Event</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Add one of those memories that deserves to be permanently
            documented in the literature.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">06</span>
          <span class="card-rule"></span>
          <span class="achievement-title">Evidence of Greatness</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Your sixth message goes here. This is a good place for something
            heartfelt.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">07</span>
          <span class="card-rule"></span>
          <span class="achievement-title">A Rare Observation</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Add a quality about the person that you think deserves its own
            little research paper.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">08</span>
          <span class="card-rule"></span>
          <span class="achievement-title">Further Findings</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Another memory, achievement, joke, compliment, or secret message
            can be placed here.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">09</span>
          <span class="card-rule"></span>
          <span class="achievement-title">A Notable Conclusion</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Write something that sums up why this person is genuinely
            wonderful.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>

      <article class="achievement-card" data-reveal-card>
        <button class="achievement-button" aria-expanded="false">
          <span class="card-number">10</span>
          <span class="card-rule"></span>
          <span class="achievement-title">The Final Finding</span>
          <span class="reveal-prompt">CLICK TO REVEAL</span>
          <span class="reveal-content">
            Put your tenth and perhaps most important discovery here.
            Congratulations: the literature review is now complete.
          </span>
          <span class="reveal-status">CLICK TO HIDE</span>
        </button>
      </article>
